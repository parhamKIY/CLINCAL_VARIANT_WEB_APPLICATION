name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stage-60:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: openai_compatible
      LLM_BASE_URL: https://provider.example/v1
      LLM_API_KEY: offline-test-key
      LLM_MODEL: offline-test-model
      LLM_MODEL_LIGHT: offline-light-model
      LLM_MODEL_STRONG: offline-strong-model
      GENOME_ASSEMBLY: GRCh38
      PHENOTYPE_EXTRACTION_MODEL: offline-phenotype-model
      VARIANT_INTERPRETATION_MODEL: offline-interpretation-model

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py config.py backend frontend tests

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit repository secrets
        run: python tests/run_secrets_audit.py

      - name: Audit dependency vulnerabilities
        run: python tools/run_dependency_audit.py

      - name: Run deterministic test suite
        run: python -m pytest -q

      - name: Run V3 acceptance gate
        run: python tests/run_stage60_acceptance.py
