[theme]
base = "light"
primaryColor = "#2B6F93"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7FAFB"
textColor = "#17324D"
font = "sans serif"

[server]
headless = true
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25
maxMessageSize = 25
enableStaticServing = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
