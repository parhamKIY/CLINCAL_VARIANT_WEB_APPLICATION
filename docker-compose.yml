services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinical-variant-app:latest
    container_name: clinical_variant_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Persistent storage: reports, databases, cache, and logs
      - ./storage:/app/storage
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
