[pytest]
markers =
    regression: critical behavior preserved after important project changes
    stage14_security: logging and user-safe error security acceptance checks
    stage15_security: repository and runtime security acceptance checks
    stage16_mvp: deterministic end-to-end MVP acceptance checks
    stage43_testing_v2: complete offline Testing V2 acceptance suite
    stage44_acceptance: final five-variant end-to-end MVP acceptance gate
    stage51_acceptance: Stage 5.1 clinical workflow end-to-end acceptance checks
    stage59_testing_v3: complete deterministic offline Testing V3 suite
    stage60_acceptance: ten-variant redesigned end-to-end V3 release gate
    stage78_acceptance: multi-variant offline provider-resilience acceptance gate
    stage79_acceptance: frozen post-acceptance defects and synthetic report assets
    stage80_specification: professor-report anatomy and visual specification checks
    stage81_report_data: renderer-neutral ReportData V4 schema checks
    stage82_docx_template: authoritative editable DOCX template checks
    stage83_docx_fidelity: golden professor-family DOCX fidelity gate checks
    stage84_report_preview: report-first high-fidelity HTML preview checks
    stage85_document_editor: explicit document-like report editing checks
    stage86_report_lifecycle: per-variant primary report lifecycle checks
    stage87_variant_integrity: variant cardinality and allele identity gate checks
    stage88_interpretation_diagnostics: interpretation failure taxonomy and observability checks
    stage89_interpretation_recovery: bounded interpretation retry, repair, and operational fallback checks
    stage90_phenotype_non_concordance: valid unrelated-phenotype interpretation contract checks
    stage91_interpretation_quality: evidence-based interpretation-model quality gate checks
    stage92_reference_model: literature and database/tool reference separation checks
    stage93_human_links: canonical reviewer-facing link resolution checks
    stage94_reference_validation: deterministic and optional live link validation checks
    stage95_analysis_summary: concise analysis-level summary and input terminology checks
    stage96_variant_status_cards: variant-first status cards and local warning attribution checks
    stage8_final_disposition: runtime semantic capability and final-disposition checks
    stage97_warning_semantics: consequence-oriented warning severity model checks
    stage98_technical_diagnostics: collapsed per-provider diagnostic drawer checks
    stage99_persistence_recovery_v4: report-first persistence and restart recovery checks
    stage100_docx_export_package: approved DOCX export and selected final package checks
    stage101_visual_regression: deterministic DOCX layout and raster harness checks
    stage102_interpretation_acceptance: corrected interpretation architecture acceptance checks
    stage103_reference_acceptance: user-facing literature-link and provenance acceptance checks
    stage104_status_warning_acceptance: primary status and warning UX acceptance checks
    stage105_professor_testcase: professor Excel testcase end-to-end acceptance checks
    stage11_2_lifecycle: analysis lifecycle timeout and terminal-state acceptance checks
    stage11_3_batch_resilience: variant-level failure isolation and batch resilience checks
    testing_v3_input: V3 input and ordering contract tests
    testing_v3_phenotype: V3 phenotype LLM and HPO acceptance tests
    testing_v3_interpretation: V3 single-model interpretation tests
    testing_v3_draft_report: V3 draft report and edit-audit tests
    testing_v3_selection: V3 inclusion and persistence tests
    testing_v3_references: V3 canonical reference tests
    testing_v3_final_report: V3 final report composition and export tests
    testing_v3_recovery: V3 refresh, resume, and retry tests
    live_provider: opt-in live external-provider diagnostic checks
